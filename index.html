<!doctype html>
<html lang="en-SG">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PR Ready SG</title>
<meta name="description" content="Prepare your Singapore PR (e-PR) application: a document checklist for each person, date checks, a passport photo check and a submission pack. Everything stays on your device.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a guided three-step flow (Household → Documents → Submission pack) behind a calm start page */
:root{
  --bg:#f6f7f9;--card:#ffffff;--ink:#142033;--muted:#4b5668;--faint:#5a6577;
  --line:#e3e7ee;--line2:#eef1f5;--field:#c9d0db;--empty:#c3cad5;
  --accent:#0b5f5f;--accent-ink:#ffffff;--accent-soft:#e2f0ef;--accent-tint:#f2f8f8;
  --warn:#b46a00;--warn-ink:#6e3f00;--warn-soft:#fdf3e2;--bad:#a3262e;--bad-soft:#fbe8e9;
  --panel:#142033;--panel-ink:#f2f4f7;--panel-muted:#aab4c4;--panel-cta:#5fc4bd;--panel-cta-ink:#0d2a29;--panel-warn:#ffd79c;
  --shadow:rgba(20,32,51,.30);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e141e;--card:#161e2b;--ink:#e8ecf2;--muted:#a9b3c3;--faint:#9aa4b5;
  --line:#263044;--line2:#202a3b;--field:#3a465c;--empty:#4b5770;
  --accent:#5fc4bd;--accent-ink:#0d2a29;--accent-soft:#163231;--accent-tint:#122523;
  --warn:#f0b45a;--warn-ink:#f6cc8f;--warn-soft:#33270f;--bad:#ff8a91;--bad-soft:#3a1c20;
  --panel:#0a1019;--panel-ink:#eef1f6;--panel-muted:#9aa4b5;--panel-cta:#5fc4bd;--panel-cta-ink:#0d2a29;--panel-warn:#ffd79c;
  --shadow:rgba(0,0,0,.6);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
[hidden]{display:none!important}
img,canvas{max-width:100%}
a{color:var(--accent)}
h1,h2,h3{margin:0;text-wrap:balance}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
@media (max-width:560px){.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.label{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.hint{font-size:14px;color:var(--muted)}

/* header */
.top{background:var(--card);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:14px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.logo{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--ink);font-family:var(--f-display);font-size:20px;font-weight:700}
.logo svg rect{fill:var(--accent)}.logo svg path{stroke:var(--accent-ink)}
.steps{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px}
.steps .bar{width:18px;height:1px;background:var(--empty)}
.step{display:inline-flex;gap:8px;align-items:center;padding:6px 12px;border-radius:999px;color:var(--muted);text-decoration:none}
.step.cur{background:var(--accent-soft);color:var(--accent);font-weight:600}
.step.done{color:var(--accent)}
.step .n{font-family:var(--f-mono)}
.local{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
@media (max-width:640px){.local{display:none}.steps .bar{width:8px}.step{padding:6px 8px}.top .wrap{row-gap:10px}.topnav a:not(.btn){display:none}}
.topnav{display:flex;gap:20px;align-items:center;flex-wrap:wrap;font-size:15px}
.topnav a{color:var(--muted);text-decoration:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:600;min-height:48px;padding:0 20px;border-radius:12px;border:1px solid var(--field);background:var(--card);color:var(--ink);text-decoration:none;cursor:pointer;position:relative}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:10px;color:var(--accent)}
.btn.ghost{border-style:dashed;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.linkbtn{font:inherit;font-size:14px;background:none;border:none;padding:8px 4px;color:var(--muted);cursor:pointer;min-height:40px}
.linkbtn.danger{color:var(--bad)}
.linkbtn.accent{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.topnav .btn{min-height:42px;color:var(--accent-ink)}

/* start page */
.hero{padding-block:72px 56px;display:flex;flex-wrap:wrap;gap:56px;align-items:center}
.hero .copy{flex:1 1 460px;min-width:0;display:flex;flex-direction:column;gap:20px}
.hero h1{font-family:var(--f-display);font-size:clamp(36px,5.2vw,56px);line-height:1.05;font-weight:700;letter-spacing:-.02em}
.hero p{margin:0;font-size:19px;color:var(--muted);max-width:34em}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.preview{flex:1 1 380px;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 48px -32px var(--shadow)}
.band{background:var(--card);border-block:1px solid var(--line)}
.band .wrap{padding-block:64px;display:flex;flex-direction:column;gap:32px}
.h2{font-family:var(--f-display);font-size:clamp(28px,3.4vw,36px);font-weight:700;letter-spacing:-.01em}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:32px}
.three div{display:flex;flex-direction:column;gap:8px}
.three h3{font-size:20px;font-weight:600}
.three p{margin:0;color:var(--muted)}
.privacy{padding-block:64px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:40px}
.privacy p{margin:0;color:var(--muted)}
.dots{display:flex;flex-direction:column;gap:16px;margin:0;padding:0;list-style:none}
.dots li{display:grid;grid-template-columns:8px minmax(0,1fr);gap:12px}
.dots li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:9px}
footer{border-top:1px solid var(--line)}
footer .wrap{padding-block:24px;display:flex;flex-wrap:wrap;gap:6px 24px;justify-content:space-between;font-size:14px;color:var(--faint)}

/* app pages */
.page{padding-block:40px 64px;display:flex;flex-direction:column;gap:24px}
.pagehead{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.pagehead h1{font-family:var(--f-display);font-size:clamp(30px,4vw,40px);font-weight:700;letter-spacing:-.01em}
.pagehead p{margin:6px 0 0;color:var(--muted)}
.cols{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start}
.colmain{flex:999 1 600px;min-width:0;display:flex;flex-direction:column;gap:24px}
.colside{flex:1 1 300px;max-width:390px;min-width:0;display:flex;flex-direction:column;gap:16px}
@media (max-width:960px){.colside{max-width:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h2{font-size:18px;font-weight:600}
@media (max-width:560px){.card{padding:18px}}

.routes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.route{display:flex;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--card)}
.route:has(input:checked){border:2px solid var(--accent);background:var(--accent-tint);padding:13px}
.route input{margin-top:4px;accent-color:var(--accent);flex:none}
.route small{display:block;font-size:14px;color:var(--muted)}

.people{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.person{border-bottom:1px solid var(--line2)}
.person:last-child{border-bottom:none}
.prow{display:grid;grid-template-columns:minmax(0,1.3fr) 76px minmax(0,1fr) minmax(0,1.4fr);gap:12px;padding:12px 16px;align-items:center}
@media (max-width:720px){.prow{grid-template-columns:minmax(0,1fr) 76px;}.prow .role,.prow .sp{grid-column:1/-1}}
.field{font:inherit;font-size:15px;color:var(--ink);background:var(--card);border:1px solid var(--field);border-radius:10px;min-height:42px;padding:0 12px;width:100%}
select.field{padding-right:8px}
.role{font-size:14px;color:var(--muted)}
.sp{font-size:14px;display:flex;gap:8px;align-items:center}
.sp.ok{color:var(--accent);font-weight:600}
.sp.need{color:var(--warn-ink)}
.sp input{accent-color:var(--accent);width:18px;height:18px}
.person details{padding:0 16px 12px}
.person summary{cursor:pointer;font-size:14px;color:var(--accent);padding:4px 0;width:max-content}
.more{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 16px;padding-top:10px;align-items:end}
.more label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.more .tog{display:flex;gap:8px;align-items:center;font-size:14px;min-height:42px}
.more .tog input{accent-color:var(--accent);width:18px;height:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.datecard{flex-direction:row;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.datecard input{max-width:240px;min-height:48px}

.summary{background:var(--panel);color:var(--panel-ink);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px}
.summary h2{font-family:var(--f-display);font-size:22px;font-weight:600}
.kv{display:flex;flex-direction:column;gap:12px;font-size:15px}
.kv div{display:flex;justify-content:space-between;gap:12px}
.kv span:first-child{color:var(--panel-muted)}
.kv span:last-child{text-align:right}
.pwarn{font-size:14px;background:rgba(255,196,120,.14);color:var(--panel-warn);border-radius:10px;padding:10px 12px}
.ctalight{display:flex;justify-content:center;align-items:center;min-height:50px;border-radius:12px;background:var(--panel-cta);color:var(--panel-cta-ink);font-weight:600;text-decoration:none;border:none;font:inherit;font-weight:600;cursor:pointer;width:100%}
.ctalight:disabled{opacity:.5;cursor:not-allowed}
.smallnote{font-size:13px;color:var(--faint);margin:0;padding:0 4px}

/* documents */
.progress{display:flex;flex-direction:column;gap:6px;min-width:240px}
.progress .t{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.meter{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);transition:width .3s}
@media (prefers-reduced-motion:reduce){.meter i{transition:none}}
.pnav{flex:1 1 220px;max-width:260px;min-width:0;display:flex;flex-direction:column;gap:6px}
.pbtn{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-radius:12px;border:1px solid transparent;background:transparent;font:inherit;color:var(--ink);text-align:left;cursor:pointer;width:100%}
.pbtn[aria-current=true]{background:var(--card);border-color:var(--accent)}
.pbtn small{display:block;font-size:13px;color:var(--muted)}
.pbtn .mono{font-size:14px;color:var(--muted)}
.pbtn[aria-current=true] .mono{color:var(--accent)}
.photobtn{margin-top:12px;justify-content:flex-start;border:1px dashed var(--empty);color:var(--accent);font-weight:600;font-size:15px}
@media (max-width:820px){.pnav{max-width:none;flex-direction:row;overflow-x:auto;flex-basis:100%}.pbtn{width:auto;flex:none}.photobtn{margin-top:0}}
.dmain{flex:999 1 540px;min-width:0;display:flex;flex-direction:column;gap:20px}
.banner{font-size:15px;background:var(--warn-soft);color:var(--warn-ink);border-radius:12px;padding:12px 16px}
.banner.info{background:var(--accent-soft);color:var(--ink)}
.group{display:flex;flex-direction:column;gap:8px}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.doc{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:14px;padding:16px;align-items:center;border-bottom:1px solid var(--line2)}
.doc:last-child{border-bottom:none}
@media (max-width:560px){.doc{grid-template-columns:24px minmax(0,1fr);padding:14px}.doc .dact{grid-column:2}}
.tick{position:relative;width:24px;height:24px;display:block}
.tick input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;width:24px;height:24px}
.tick:focus-within{outline:2px solid var(--accent);outline-offset:2px;border-radius:50%}
.tick svg{display:block}
.dt{font-weight:600}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--warn-soft);color:var(--warn-ink);margin-left:6px;vertical-align:1px}
.tag.plain{background:var(--line2);color:var(--muted)}
.dn{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.dact{display:flex;gap:4px;align-items:center;justify-content:flex-end}
.footnav{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding-top:8px}
.footnav>a:first-child{font-weight:600;text-decoration:none}
.photo{display:flex;flex-direction:column;gap:12px}
.photo .res{display:flex;flex-direction:column;gap:6px}
.photo canvas{max-width:140px;border:1px solid var(--line);border-radius:8px}
.ok{color:var(--accent);font-weight:600}.warn{color:var(--warn-ink);font-weight:600}.bad{color:var(--bad);font-weight:600}

/* pack */
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.checks li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px;align-items:start}
.checks svg{margin-top:2px}
.tree{background:var(--bg);border-radius:12px;padding:16px 18px;font-family:var(--f-mono);font-size:14px;line-height:1.9;overflow-x:auto;white-space:nowrap}
.tree .in{padding-left:24px}
.tree .dim{color:var(--faint)}
ol.day{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px}
.dates{display:flex;flex-direction:column}
.dates div{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:15px}
.dates div:last-child{border-bottom:none}
.dates .mono{font-size:13px;color:var(--faint);padding-top:2px}
.summary p{margin:0;font-size:15px;color:var(--panel-muted)}
#msg{font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<header class="top"><div class="wrap" id="top"></div></header>
<main id="view"></main>
<footer><div class="wrap">
  <span>Independent preparation aid. Not affiliated with ICA.</span>
  <span>Based on ICA's published checklist. Always confirm at <a href="https://www.ica.gov.sg/information-and-e-services/citizenship-and-permanent-residence/permanent-residence/permanent-residence-application" target="_blank" rel="noopener">ica.gov.sg</a> before you submit.</span>
</div></footer>
<input type="file" id="openFile" accept=".json,application/json" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function(){
const KEY='prready.v2', OLDKEY='prready.v1';
const $=id=>document.getElementById(id);
const SCHEMES={
  ep:{label:'Employment Pass or S Pass',main:'Main applicant',sponsor:null,hint:'No sponsor. You submit for yourself and your family.'},
  spouse:{label:'Spouse of a Citizen or PR',main:'Applying spouse',sponsor:'Sponsor (your spouse)',hint:'Your Citizen or PR spouse sponsors and fills in the form.'},
  child:{label:'Child of a Citizen or PR',main:'Applying child',sponsor:'Sponsor (your parent)',hint:'Unmarried and below 21. Your Citizen or PR parent sponsors.'},
  parent:{label:'Parent of a Citizen',main:'Aged parent',sponsor:'Sponsor (your child, 21+)',hint:'Sponsored by your Citizen child aged 21 or above.'},
  student:{label:'Student in Singapore',main:'Student',sponsor:null,hint:'Passed a national exam (PSLE, N, O or A Level) or in the IP.'}
};
const ROLE={main:'Main applicant',spouse:'Spouse',child:'Child',nonspouse:'Spouse (not applying)',sponsor:'Sponsor'};
const VIEWS=['start','household','documents','pack'];
const STEPS=[['household','Household'],['documents','Documents'],['pack','Submission pack']];

/* ---------- helpers ---------- */
const iso=d=>d.toISOString().slice(0,10);
function addMonths(d,m){const x=new Date(d);x.setMonth(x.getMonth()+m);return x}
const fmt=d=>d.toLocaleDateString('en-SG',{day:'numeric',month:'short',year:'numeric'});
const fmtM=d=>d.toLocaleDateString('en-SG',{month:'short',year:'numeric'});
const uid=()=>Math.random().toString(36).slice(2,8);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isApplicant=p=>['main','spouse','child'].includes(p.role);
const pname=p=>(p.name&&p.name.trim())||(p.role==='main'?SCHEMES[S.scheme].main:ROLE[p.role]);
const roleText=p=>p.role==='main'?SCHEMES[S.scheme].main:p.role==='sponsor'?SCHEMES[S.scheme].sponsor:ROLE[p.role];
const target=()=>new Date((S.target||iso(addMonths(new Date(),1)))+'T00:00:00');
const ICON={
  done:'<svg aria-hidden="true" width="22" height="22" viewBox="0 0 20 20"><circle cx="10" cy="10" r="10" fill="var(--accent)"/><path d="M6 10.5l2.6 2.6L14 7.6" stroke="var(--accent-ink)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  warn:'<svg aria-hidden="true" width="22" height="22" viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="none" stroke="var(--warn)" stroke-width="2"/><path d="M10 5.5v5M10 13.5v.5" stroke="var(--warn)" stroke-width="2" stroke-linecap="round"/></svg>',
  todo:'<svg aria-hidden="true" width="22" height="22" viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="none" stroke="var(--empty)" stroke-width="2"/></svg>',
  lock:'<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>',
  logo:'<svg aria-hidden="true" width="28" height="28" viewBox="0 0 28 28" fill="none"><rect x="1" y="1" width="26" height="26" rx="7"/><path d="M8 14.5l4 4 8-9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  cam:'<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="12" cy="12" r="3"/></svg>'
};

/* ---------- state ---------- */
function blank(){return {scheme:'ep',target:iso(addMonths(new Date(),1)),marriage:'none',x:{divorce:false,separated:false,name:false,prevKids:false,lang:false},
  people:[{id:uid(),role:'main',name:'',sex:'f',age:30,bornSG:false,work:'employed',overseas:false,singpass:false}],checked:{},files:{},cur:null,example:false}}
function example(){return {scheme:'ep',target:iso(addMonths(new Date(),1)),marriage:'overseas',x:{divorce:false,separated:false,name:false,prevKids:false,lang:true},
  people:[{id:'p1',role:'main',name:'Wei Ling',sex:'f',age:34,bornSG:false,work:'employed',overseas:false,singpass:true},
          {id:'p2',role:'spouse',name:'Arjun',sex:'m',age:36,bornSG:false,work:'employed',overseas:true,singpass:false},
          {id:'p3',role:'child',name:'Mei',sex:'f',age:6,bornSG:true,work:'none',overseas:false,singpass:false}],checked:{},files:{},cur:'p1',example:true}}
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))||JSON.parse(localStorage.getItem(OLDKEY))}catch(e){S=null}
if(!S||!Array.isArray(S.people))S=blank();
S.files=S.files||{};S.checked=S.checked||{};S.x=Object.assign({divorce:false,separated:false,name:false,prevKids:false,lang:false},S.x||{});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let photoOpen=false;

function syncSponsor(){
  const need=!!SCHEMES[S.scheme].sponsor,has=S.people.find(p=>p.role==='sponsor');
  if(need&&!has)S.people.push({id:uid(),role:'sponsor',name:'',sex:'m',age:40,bornSG:true,work:'employed',overseas:false,singpass:false});
  if(!need&&has)S.people=S.people.filter(p=>p.role!=='sponsor');
}

/* ---------- document rules (ICA Document Checklist for Permanent Residence) ---------- */
const GROUP={photo:'Identity',pp:'Identity',bc:'Identity',adopt:'Identity',dp:'Identity',
  mc:'Family',sep:'Family',div:'Family',cust:'Family',consent:'Family',nc_bc:'Family',
  edu:'Education and work',skill:'Education and work',mem:'Education and work',exam:'Education and work',loe:'Education and work',pay:'Education and work',tax:'Education and work',acra:'Education and work',bs:'Education and work',pl:'Education and work',nc_pay:'Education and work',nc_tax:'Education and work'};
function docsFor(p){
  const out=[],app=isApplicant(p),spo=p.role==='sponsor',non=p.role==='nonspouse';
  const married=S.marriage!=='none'&&p.age>=18,adult=p.age>=17;
  const add=(id,t,n,o={})=>out.push({key:p.id+':'+id,id,g:GROUP[id],t,n,...o});
  if(app)add('photo','Passport photo','Recent colour photo, 400 × 514 px, white background.',{photo:true});
  if(app||non)add('pp','Passport bio-data page','Not needed for documents issued by ICA.');
  if((app||non)&&!p.bornSG)add('bc','Birth certificate','Birth registered outside Singapore.',{tr:true});
  if(app&&p.role==='child')add('adopt','Adoption papers','Only if legally adopted.',{optional:true});
  if(S.x.name&&adult&&(app||non))add('dp','Deed poll or religious certificate','Only for a person whose name changed.',{tr:true,optional:true});
  if(married&&S.marriage==='overseas'&&(app||non))add('mc','Marriage certificate','Marriage registered outside Singapore.',{tr:true});
  if(S.x.separated&&married&&(app||non))add('sep','Separation deed','',{tr:true});
  if(S.x.divorce&&adult)add('div','Divorce certificate','Including the Certificate of Making Interim Judgment Final. Only for the person previously divorced.',{tr:true,optional:true});
  if(S.x.prevKids&&adult&&(app||non))add('cust','Custody papers','For children from a previous marriage.',{tr:true});
  if(S.x.prevKids&&app&&p.role==='child'&&p.age<21)add('consent','Letter of consent from ex-spouse','For a child under joint custody.');
  if(adult&&!(spo&&p.work==='none')){
    add('edu','Educational certificates and transcripts','Highest qualifications first.',{tr:true});
    if(p.work!=='none'){add('skill','Skill certificates or professional licences','If any.',{optional:true});if(!spo)add('mem','Membership certificates','Professional bodies, if any.',{optional:true})}
  }
  if(S.scheme==='student'&&p.role==='main')add('exam','National exam results or IP enrolment','Evidence for the student scheme.');
  if(p.work==='employed'){
    add('loe','Letter of employment','Must state occupation, start date, and basic and gross monthly salary.',{dated:true});
    add('pay','Pay slips, last 6 months','',{pay:true});
    if(p.overseas)add('tax','Income tax assessments, latest 3 years','Because this person works overseas.',{tr:true});
  }
  if(p.work==='self'){
    add('acra','ACRA Business Registration Certificate','Latest copy.');
    add('bs','Balance sheets, latest 3 years','');
    add('pl','Profit and loss statements, latest 3 years','');
  }
  if(S.scheme==='parent'&&spo){
    add('nc_bc',"Siblings' birth certificates",'Your non-applying children, if births were not registered in Singapore.',{tr:true,optional:true});
    add('nc_pay',"Siblings' latest pay slip",'Latest 1 month, for your non-applying children.');
    add('nc_tax',"Siblings' latest tax assessment",'Only if they work overseas.',{optional:true});
  }
  return out;
}
const ORDER=['main','spouse','child','nonspouse','sponsor'];
const sorted=()=>[...S.people].sort((a,b)=>ORDER.indexOf(a.role)-ORDER.indexOf(b.role));
const isDone=x=>!!(S.checked[x.key]||S.files[x.key]);
function tally(p){const d=docsFor(p).filter(x=>!x.optional);return [d.filter(isDone).length,d.length]}
function totals(){let a=0,b=0;S.people.forEach(p=>{const t=tally(p);a+=t[0];b+=t[1]});return [a,b]}
const letterFrom=()=>addMonths(target(),-3);
function payMonths(){const t=target(),m=[];for(let i=6;i>=1;i--)m.push(addMonths(new Date(t.getFullYear(),t.getMonth(),1),-i).toLocaleDateString('en-SG',{month:'short'}));return m.join(' · ')+' '+addMonths(t,-1).getFullYear()}
function nsPeople(){return S.people.filter(p=>isApplicant(p)&&p.sex==='m'&&(p.role==='child'||S.scheme==='student'||S.scheme==='child'))}
function singpassMissing(){return S.people.filter(p=>(isApplicant(p)||p.role==='sponsor')&&p.age>=15&&!p.singpass)}
function fees(){const apps=S.people.filter(isApplicant);const ic=apps.filter(p=>p.age>=15).length;return {now:apps.length*100,later:apps.length*20+apps.length*50+ic*50,n:apps.length,ic}}

/* ---------- local file storage (IndexedDB, this browser only) ---------- */
let dbp=null;
function db(){if(dbp)return dbp;dbp=new Promise((res,rej)=>{try{const r=indexedDB.open('prready-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});dbp.catch(()=>{dbp=null});return dbp}
async function idb(mode,fn){const d=await db();return new Promise((res,rej)=>{const tx=d.transaction('files',mode);fn(tx.objectStore('files'));tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})}
async function idbGet(k){const d=await db();return new Promise((res,rej)=>{const r=d.transaction('files').objectStore('files').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function say(t){const m=$('msg');if(m)m.textContent=t}
async function storeFile(k,file){
  if(!file)return;
  try{await idb('readwrite',st=>st.put(file,k));S.files[k]={name:file.name,size:file.size,type:file.type,at:Date.now()};render();say('Saved '+file.name+' in this browser.')}
  catch(e){render();say("This browser blocked local storage, so the file wasn't kept. Use a normal (not private) window.")}
}
async function removeFile(k){try{await idb('readwrite',st=>st.delete(k))}catch(e){}delete S.files[k];render()}
function saveBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
const kb=n=>n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';

function renderTop(v){
  const logo=`<a class="logo" href="#start">${ICON.logo}<span>PR Ready</span></a>`;

  const ci=STEPS.findIndex(s=>s[0]===v);
  const steps=STEPS.map((s,i)=>{const cls=i<ci?'done':i===ci?'cur':'';const mark=i<ci?ICON.done.replace('width="22" height="22"','width="14" height="14"'):`<span class="n">${i+1}</span>`;
    return (i?'<span class="bar" aria-hidden="true"></span>':'')+(i===ci?`<span class="step cur" aria-current="step">${mark}${s[1]}</span>`:`<a class="step ${cls}" href="#${s[0]}">${mark}${s[1]}</a>`)}).join('');
  $('top').innerHTML=logo+`<nav class="steps" aria-label="Progress">${steps}</nav><span class="local">${ICON.lock}Saved on this device</span>`;
}

  if(photoOpen)main+=`<section class="card photo" id="photoCard"><h2>Passport photo check</h2><p class="hint" style="margin:0">ICA asks for a recent colour photo, 400 × 514 pixels, full face, white background. Your photo is checked in this browser and not uploaded.</p>

function docRow(x){
  const f=S.files[x.key],done=isDone(x);
  const state=done?'done':x.dated?'warn':'todo';
  let tags='';
  if(x.tr&&S.x.lang)tags+='<span class="tag">Translation if not English</span>';
  if(x.dated&&!done)tags+=`<span class="tag">Dated after ${fmt(letterFrom())}</span>`;
  if(x.optional)tags+='<span class="tag plain">If applicable</span>';
  let note=x.n;
  if(x.pay)note=`<span class="mono" style="font-size:13px">${payMonths()}</span>`;
  if(f)note=`${esc(f.name)} · ${kb(f.size)}`;
  const act=f?`<button class="linkbtn" data-rm="${esc(x.key)}">Remove file</button>`:`<label class="btn sm">Attach<input type="file" data-up="${esc(x.key)}" accept="application/pdf,image/jpeg,image/png" aria-label="Attach ${esc(x.t)}"></label>`;
  return `<div class="doc"><label class="tick"><input type="checkbox" id="c-${x.key}" data-doc="${x.key}" ${done?'checked':''} ${f?'disabled':''}><span class="sr">${esc(x.t)} collected</span>${ICON[state]}</label>
    <div><div class="dt">${esc(x.t)}${tags}</div><div class="dn">${note}</div></div><div class="dact">${act}</div></div>`;
}
function checkPhoto(file){
  const res=$('photoRes'),c=$('pc');if(!file||!res)return;
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{
    const w=img.naturalWidth,h=img.naturalHeight;c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.drawImage(img,0,0);c.hidden=false;
    const bw=Math.max(2,Math.round(w*.06)),bh=Math.max(2,Math.round(h*.06));let n=0,lum=0,sat=0;
    const sample=(x,y,ww,hh)=>{const d=ctx.getImageData(x,y,ww,hh).data;for(let i=0;i<d.length;i+=16){const r=d[i],g=d[i+1],b=d[i+2];lum+=(r+g+b)/3;sat+=Math.max(r,g,b)-Math.min(r,g,b);n++}};
    sample(0,0,w,bh);sample(0,0,bw,Math.round(h*.6));sample(w-bw,0,bw,Math.round(h*.6));lum/=n;sat/=n;
    const dimOk=w===400&&h===514,ratioOk=Math.abs(w/h-400/514)<0.01,bgOk=lum>=235&&sat<18,bgMid=lum>=215&&sat<30;
    res.innerHTML=`<span class="${dimOk?'ok':ratioOk?'warn':'bad'}">${dimOk?'✓ 400 × 514 px':ratioOk?`Right shape, wrong size (${w} × ${h} px). Resize to 400 × 514.`:`✗ ${w} × ${h} px. ICA needs 400 × 514 px.`}</span>
      <span class="${bgOk?'ok':bgMid?'warn':'bad'}">${bgOk?'✓ Background looks white':bgMid?'Background is off-white or shadowed. Retake against a white wall with even light.':'✗ Background does not look white'}</span>
      <span class="hint">Also check: taken recently, full face, eyes open, no headgear unless worn for religious or racial customs.</span>`;
    URL.revokeObjectURL(url);
  };
  img.onerror=()=>{res.innerHTML='<span class="bad">That file could not be read as an image. Use a JPG or PNG.</span>'};
  img.src=url;
}

/* ---------- step 3: submission pack ---------- */
const slug=t=>String(t).replace(/\(.*?\)/g,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)||'file';
function packName(p,i,x,f){const ext=(f&&f.name.includes('.'))?f.name.slice(f.name.lastIndexOf('.')).toLowerCase():'';return String(i+1).padStart(2,'0')+'_'+slug(pname(p))+'_'+slug(x.t)+ext}
function packChecks(){
  const c=[];
  S.people.filter(p=>(isApplicant(p)||p.role==='sponsor')&&p.age>=15).forEach(p=>c.push(p.singpass?['done',esc(pname(p))+' has an active Singpass with 2FA']:['warn',`<b>${esc(pname(p))} needs an active Singpass.</b> <a href="#household">Update in household</a>`]));
  const t=totals();c.push(t[0]===t[1]?['done','All required documents collected']:['warn',`<b>${t[1]-t[0]} of ${t[1]} documents still missing.</b> <a href="#documents">Go to documents</a>`]);
  if(S.people.some(p=>p.work==='employed'))c.push(['todo','Employment letters dated on or after '+fmt(letterFrom())]);
  c.push(['todo',"Every applicant's pass stays valid until ICA gives the outcome"]);
  return c;
}
function viewPack(){
  const ppl=sorted();let n=0;const tree=['<div>00_Summary.txt</div>'];
  ppl.forEach((p,pi)=>{const docs=docsFor(p);const files=docs.map((x,i)=>[x,i]).filter(([x])=>S.files[x.key]);n+=files.length;if(!files.length)return;
    tree.push(`<div>${pi+1}_${esc(slug(pname(p)))}/</div>`);files.slice(0,4).forEach(([x,i])=>tree.push(`<div class="in">${esc(packName(p,i,x,S.files[x.key]))}</div>`));if(files.length>4)tree.push(`<div class="in dim">+ ${files.length-4} more</div>`)});
  const sch=SCHEMES[S.scheme],spon=S.people.find(p=>p.role==='sponsor'),fills=spon?pname(spon):pname(ppl[0]),f=fees(),t=target();
  return `<div class="wrap page">
    <div class="pagehead"><div><h1>Your submission pack</h1><p>Everything you need on submission day, in the order you will upload it.</p></div></div>
    <div class="cols"><div class="colmain">
      <section class="card"><h2>Before you submit</h2><ul class="checks">${packChecks().map(c=>`<li>${ICON[c[0]].replace(/width="22" height="22"/,'width="20" height="20"')}<span>${c[1]}</span></li>`).join('')}</ul></section>
      <section class="card"><div class="row" style="justify-content:space-between;align-items:baseline"><h2>What's in the pack</h2><span class="hint">${n} file${n===1?'':'s'} · renamed in upload order</span></div>
        ${n?`<div class="tree">${tree.join('')}</div>`:'<p class="hint" style="margin:0">No files attached yet. <a href="#documents">Attach files in the documents step</a> to include them.</p>'}</section>
      <section class="card"><h2>On submission day</h2><ol class="day">
        <li>Each applicant aged 15 or above logs in to ICA's e-Service with their own Singpass.</li>
        <li>${esc(fills)} fills in the form and uploads the files from this pack.</li>
        <li>Each applicant reviews the form and makes their own declarations.</li>
        <li>Pay S$${f.now} (S$100 per applicant) on the e-Service and save your reference ID.</li>
        <li>Keep every pass valid until the outcome, and answer any ICA request for documents quickly.</li></ol></section>
      <section class="card"><h2>Key dates</h2><div class="dates">
        <div><span class="mono">${fmt(addMonths(t,-2))}</span><span>Order any translations. Embassy and notary translations can take weeks.</span></div>
        <div><span class="mono">${fmt(addMonths(t,-1))}</span><span>Everyone aged 15 or above has an active Singpass.</span></div>
        <div><span class="mono">${fmt(letterFrom())}</span><span>Earliest date for employment letters.</span></div>
        <div><span class="mono">${fmt(t)}</span><span>Submit on ICA's e-Service.</span></div>
        <div><span class="mono">${fmtM(addMonths(t,6))}</span><span>Outcome by email, generally within 6 months. Then complete formalities and pay S$${f.later}.</span></div></div></section>
    </div>
    <aside class="colside">
      <section class="summary"><h2>Download</h2><p>One .zip with every attached file and a summary sheet. Download it again any time.</p>
        <button class="ctalight" id="packZip">Download submission pack</button><span id="msg" aria-live="polite" style="color:var(--panel-muted)"></span></section>
      <section class="card"><h2 style="font-size:16px">Your progress</h2><p class="hint" style="margin:0">Saved in this browser. Save a copy to continue on another computer, or in case your browser data is cleared.</p>
        <div class="row" style="gap:8px"><button class="btn sm" style="color:var(--ink)" data-act="saveprog">Save my progress</button><button class="btn sm" style="color:var(--ink)" data-act="openprog">Open saved progress</button></div>
        <button class="linkbtn danger" style="align-self:flex-start;padding-left:0" data-act="wipe">Delete everything from this browser</button></section>
    </aside></div></div>`;
}
function packSummary(){
  const L=[],sch=SCHEMES[S.scheme];
  L.push('PR READY SG · SUBMISSION PACK','Generated: '+fmt(new Date()),'Planned submission: '+fmt(target()),'Applying as: '+sch.label,'');
  L.push('BEFORE YOU SUBMIT');packChecks().forEach(c=>L.push((c[0]==='done'?'[x] ':c[0]==='warn'?'[ ] ':'[?] ')+c[1].replace(/<[^>]+>/g,'')));L.push('');
  sorted().forEach((p,pi)=>{const docs=docsFor(p);if(!docs.length)return;L.push((pi+1)+'. '+pname(p)+' — '+roleText(p));
    docs.forEach((x,i)=>{const f=S.files[x.key];L.push('   '+(f?'[file] '+packName(p,i,x,f):isDone(x)?'[collected, no file] '+x.t:(x.optional?'[if applicable] ':'[MISSING] ')+x.t))});L.push('')});
  L.push('ON SUBMISSION DAY','1. Each applicant aged 15+ logs in to ICA e-Service with their OWN Singpass. Never share Singpass logins.',
   '2. '+(sch.sponsor?'The sponsor':'The main applicant')+' fills in the form and uploads the files from this pack.','3. Each applicant reviews the form and makes their own declarations.',
   '4. Pay S$100 per applicant on ICA e-Service. Save the reference ID.','5. Keep every pass valid until the outcome. Answer any ICA request for more documents quickly.','','Not affiliated with ICA. Confirm requirements at www.ica.gov.sg.');
  return L.join('\r\n');
}
async function buildZip(btn){
  if(!window.JSZip){say('The zip tool did not load. Check your internet connection and reload the page.');return}
  btn.disabled=true;btn.textContent='Preparing pack…';
  try{const zip=new JSZip();let n=0,miss=0;const ppl=sorted();
    for(let pi=0;pi<ppl.length;pi++){const p=ppl[pi],docs=docsFor(p);let folder=null;
      for(let i=0;i<docs.length;i++){const x=docs[i],f=S.files[x.key];if(!f)continue;const blob=await idbGet(x.key);
        if(blob){folder=folder||zip.folder(String(pi+1)+'_'+slug(pname(p)));folder.file(packName(p,i,x,f),blob);n++}else miss++}}
    zip.file('00_Summary.txt',packSummary());
    saveBlob(await zip.generateAsync({type:'blob'}),'PR-Ready-pack-'+iso(new Date())+'.zip');
    say('Pack downloaded with '+n+' file'+(n===1?'':'s')+(miss?'. '+miss+' file(s) were no longer in this browser; attach them again.':'.'));
  }catch(e){say('The pack could not be built in this browser. Try again, or use a different browser.')}
  finally{btn.disabled=false;btn.textContent='Download submission pack'}
}
function saveProgress(){
  const d=new Date(),name='PR-Ready-progress-'+d.getDate()+'-'+d.toLocaleDateString('en-SG',{month:'short'})+'-'+d.getFullYear()+'.json';
  saveBlob(new Blob([JSON.stringify({...S,files:{},app:'pr-ready',v:2})],{type:'application/json'}),name);
  say('Progress saved as '+name+'. Attached files are not included; keep your originals.');
}
function openProgress(file){
  file.text().then(txt=>{const o=JSON.parse(txt);if(!o||!Array.isArray(o.people))throw 0;
    o.files=S.files;o.checked=o.checked||{};o.x=Object.assign({divorce:false,separated:false,name:false,prevKids:false,lang:false},o.x||{});o.example=false;S=o;render();say('Progress opened. Files already in this browser were kept.')})
   .catch(()=>say("That file isn't a PR Ready progress file."));
}
let wipeArmed=false;
async function wipe(btn){
  if(!wipeArmed){wipeArmed=true;btn.textContent='Click again to delete everything';setTimeout(()=>{wipeArmed=false;if(btn.isConnected)btn.textContent='Delete everything from this browser'},4000);return}
  wipeArmed=false;try{localStorage.removeItem(KEY);localStorage.removeItem(OLDKEY)}catch(e){}try{await idb('readwrite',st=>st.clear())}catch(e){}
  S=blank();location.hash='#start';render();
}

/* ---------- render + events ---------- */
function route(){const h=location.hash.slice(1);return VIEWS.includes(h)?h:'start'}
function render(){
  syncSponsor();const v=route(),fid=document.activeElement&&document.activeElement.id;
  renderTop(v);
  $('view').innerHTML=v==='household'?viewHousehold():v==='documents'?viewDocuments():v==='pack'?viewPack():viewStart();
  document.title=v==='start'?'PR Ready SG':(STEPS.find(s=>s[0]===v)[1]+' · PR Ready SG');
  if(fid&&$(fid))$(fid).focus();
  save();
}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);render();const el=!VIEWS.includes(h)&&h?$(h):null;if(el)el.scrollIntoView();else window.scrollTo(0,0)});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.f==='name'){const p=S.people.find(x=>x.id===t.dataset.id);if(p){p.name=t.value;S.example=false;const sm=$('summary');if(sm)sm.innerHTML=summaryHTML();save()}}});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.route!==undefined){S.scheme=t.value;S.example=false;render();return}
  if(t.id==='target'){S.target=t.value||S.target;render();return}
  if(t.id==='addRole'&&t.value){const r=t.value;S.people.push({id:uid(),role:r,name:'',sex:r==='child'?'m':'f',age:r==='child'?8:32,bornSG:r==='child',work:r==='child'?'none':'employed',overseas:false,singpass:false});S.example=false;render();return}
  if(t.dataset.doc){S.checked[t.dataset.doc]=t.checked;render();return}
  if(t.dataset.up){storeFile(t.dataset.up,t.files[0]);return}
  if(t.id==='photoIn'){checkPhoto(t.files[0]);return}
  if(t.id==='openFile'){const f=t.files[0];t.value='';if(f)openProgress(f);return}
  if(t.dataset.f&&t.dataset.f!=='name'){const p=S.people.find(x=>x.id===t.dataset.id);if(!p)return;const f=t.dataset.f;
    p[f]=t.type==='checkbox'?t.checked:f==='age'?Math.max(0,Math.min(110,parseInt(t.value||'0',10)||0)):t.value;S.example=false;render()}
});
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.open){const p=S.people.find(x=>x.id===d.dataset.open);if(p)p._open=d.open}},true);
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.chip){const k=t.dataset.chip;if(k==='m-overseas')S.marriage=S.marriage==='overseas'?'none':'overseas';else if(k==='m-sg')S.marriage=S.marriage==='sg'?'none':'sg';else S.x[k]=!S.x[k];S.example=false;render();return}
  if(t.dataset.del){S.people=S.people.filter(p=>p.id!==t.dataset.del);render();return}
  if(t.dataset.person){S.cur=t.dataset.person;render();return}
  if(t.dataset.rm){removeFile(t.dataset.rm);return}
  if(t.id==='packZip'){buildZip(t);return}
  const a=t.dataset.act;
  if(a==='example'){const f=S.files;S=example();S.files=f;render();return}
  if(a==='photo'){photoOpen=!photoOpen;render();if(photoOpen&&$('photoCard'))$('photoCard').scrollIntoView({block:'nearest'});return}
  if(a==='saveprog'){saveProgress();return}
  if(a==='openprog'){$('openFile').click();return}
  if(a==='wipe'){wipe(t);return}
});
render();
})();
</script>
</body>
</html>
